apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox
          command: [ 'sh', '-c', 'until nc -z mysql-db 3306; do echo waiting for mysql; sleep 2; done;' ]
      containers:
        - name: worker
          image: asia-east1-docker.pkg.dev/root-rarity-426706-v2/urlshortener/worker:v01
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret